# Wazuh workers StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: worker
      name: wazuh-manager-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                    node-type: worker
      volumes:
        - name: config
          configMap:
            name: wazuh-conf
        - name: filebeat-certs
          secret:
            secretName: indexer-certs
        - name: sentinelone-decoders ###############
          configMap:
            name: sentinelone-decoders-configmap                 
        - name: sentinelone-rules 
          configMap:
            name: sentinelone-rules-configmap
        - name: wazuh-filebeat-configmap
          configMap:
            name: wazuh-filebeat-conf   
        - name: custom-rules-and-decoders-cm
          configMap:
            name: custom-rules-and-decoders
            defaultMode: 0660       
        - name: integrations-cm-volume
          configMap:
            name: integrations-cm
            defaultMode: 0750   
        - name: syslog-ng-cm-volume
          configMap:
            name: syslog-ng-cm                                                                           
      securityContext:
        fsGroup: 101
      containers:
        - name: wazuh-manager
          image: 'wazuh/wazuh-manager:4.14.7'
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Wait for files to be copied by entrypoint
                    sleep 5
                    # Fix permissions
                    if [ -f /var/ossec/integrations/custom-n8n-cm ]; then
                      chmod 0750 /var/ossec/integrations/custom-n8n-cm
                      chmod 0750 /var/ossec/integrations/custom-n8n-cm.py
                      echo "✅ Integration permissions fixed"
                    fi          
          resources:
            limits:
              cpu: 1500m
              memory: 2Gi
          securityContext:
            capabilities:
              add: ["SYS_CHROOT"]
          volumeMounts:
            - name: config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: worker.conf
              readOnly: true
            - name: filebeat-certs
              mountPath: /etc/ssl/root-ca.pem
              readOnly: true
              subPath: root-ca.pem
            - name: filebeat-certs
              mountPath: /etc/ssl/filebeat.pem
              subPath: filebeat.pem
              readOnly: true
            - name: filebeat-certs
              mountPath: /etc/ssl/filebeat.key
              subPath: filebeat-key.pem
              readOnly: true
            - name: wazuh-manager-worker
              mountPath: /var/ossec/api/configuration
              subPath: wazuh/var/ossec/api/configuration
            - name: wazuh-manager-worker
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-manager-worker
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-worker
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
            - name: wazuh-manager-worker
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh/var/ossec/var/multigroups
            - name: wazuh-manager-worker
              mountPath: /var/ossec/integrations
              subPath: wazuh/var/ossec/integrations
            - name: wazuh-manager-worker
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh/var/ossec/active-response/bin
            - name: wazuh-manager-worker
              mountPath: /var/ossec/agentless
              subPath: wazuh/var/ossec/agentless
            - name: wazuh-manager-worker
              mountPath: /var/ossec/wodles
              subPath: wazuh/var/ossec/wodles
            - name: wazuh-manager-worker
              mountPath: /etc/filebeat
              subPath: filebeat/etc/filebeat
            - name: wazuh-manager-worker
              mountPath: /var/lib/filebeat
              subPath: filebeat/var/lib/filebeat      
            - name: integrations-cm-volume  ############# STARTS MY CONFIG ###########################
              mountPath: /wazuh-config-mount/integrations/custom-n8n-cm.py
              subPath: custom-n8n-cm.py         
            - name: integrations-cm-volume
              mountPath: /wazuh-config-mount/integrations/custom-n8n-cm
              subPath: custom-n8n-cm 
            - name: wazuh-filebeat-configmap
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml                               
            - name: custom-rules-and-decoders-cm
              mountPath: /wazuh-config-mount/etc/decoders/sentinelone_decoders.xml
              subPath: sentinelone_decoders.xml
              readOnly: true                
            - name: custom-rules-and-decoders-cm
              mountPath: /wazuh-config-mount/etc/rules/sentinelone_rules.xml
              subPath: sentinelone_rules.xml
              readOnly: true
            - name: custom-rules-and-decoders-cm
              mountPath: /wazuh-config-mount/etc/rules/local_rules.xml
              subPath: local_rules.xml
              readOnly: true                              
          ports:
            - containerPort: 1514
              name: agents-events
            - containerPort: 1516
              name: cluster
            - containerPort: 514
              name: syslog-events                 
          env:
            - name: INDEXER_URL
              value: 'https://indexer:9200'
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: password
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: 'full'
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /etc/ssl/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /etc/ssl/filebeat.pem
            - name: SSL_KEY
              value: /etc/ssl/filebeat.key
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-cluster-key
                  key: key
            - name: M365_TENANT_ID ################
              valueFrom:
                secretKeyRef:
                  name: m365-cred-secret
                  key: TENANT_ID
            - name: M365_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: m365-cred-secret
                  key: CLIENT_ID
            - name: M365_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: m365-cred-secret
                  key: CLIENT_SECRET                    
        # - name: syslog-ng
        #   image: balabit/syslog-ng:4.8.0
        #   securityContext:
        #     runAsUser: 0
        #     runAsGroup: 0
        #     allowPrivilegeEscalation: true
        #   volumeMounts:
        #     - name: syslog-ng-config-volume
        #       mountPath: /etc/syslog-ng/syslog-ng.conf
        #       subPath: syslog-ng.conf
        #     - name: syslog-ng-tls-writable  #EmptyDir
        #       mountPath: /etc/syslog-ng/tls              
        #     - name: syslog-ng-tlskey-volume
        #       mountPath: /tmp/tls/tls.key
        #       subPath: tls.key
        #     - name: syslog-ng-tlscrt-volume
        #       mountPath: /tmp/tls/tls.crt
        #       subPath: tls.crt
        #     - name: syslog-ng-ca-volume
        #       mountPath: /tmp/tls/ca.crt
        #       subPath: ca.crt
        #     - name: syslog-ng-entrypoint-volume
        #       mountPath: /usr/local/bin/entrypoint.sh
        #       subPath: entrypoint.sh
        #       readOnly: true
        #   command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]                             
        #   ports:       
        #     - containerPort: 6514
        #       name: syslog-tls                     
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
        namespace: wazuh
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 500Mi
