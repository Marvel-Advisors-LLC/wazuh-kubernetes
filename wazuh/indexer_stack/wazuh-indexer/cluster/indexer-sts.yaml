# Indexer StatefulSet: 3 master nodes.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wazuh-indexer
  serviceName: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
      name: wazuh-indexer
    spec:
      securityContext:
        fsGroup: 1000
      # Set the wazuh-indexer volume permissions so the wazuh-indexer user can use it
      volumes:
        - name: indexer-certs
          secret:
            secretName: indexer-certs
            defaultMode: 0600
        - name: indexer-conf
          configMap:
            name: indexer-conf
            defaultMode: 0600
      initContainers:
        - name: volume-mount-hack
          image: busybox
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          command:
            - sh
            - '-c'
            - 'chown -R 1000:1000 /var/lib/wazuh-indexer'
          volumeMounts:
            - name: wazuh-indexer
              mountPath: /var/lib/wazuh-indexer
        - name: increase-the-vm-max-map-count
          image: busybox
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
      containers:
        - name: wazuh-indexer
          image: 'wazuh/wazuh-indexer:4.14.2'
          resources:
            requests:
              cpu: 500m
              memory: 3500Mi
            limits:
              cpu: 1 # originally on 500m
              memory: 4Gi # originally 1564Mi
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: '-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true'
            - name: CLUSTER_NAME
              value: wazuh
            - name: NETWORK_HOST
              value: "0.0.0.0"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY_SERVICE
              value: wazuh-indexer
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: 'true'
            - name: OPENSEARCH_PATH_CONF  # Config for S3 bucket snapshots
              value: "/usr/share/wazuh-indexer/config"     
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: wazuh-s3-creds
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-s3-creds
                  key: secret_access_key
            - name: GMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp
                  key: username

            - name: GMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp
                  key: password                                
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              add: ["SYS_CHROOT"]
          volumeMounts:
            - name: wazuh-indexer
              mountPath: /var/lib/wazuh-indexer
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/node-key.pem
              subPath: node-key.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/node.pem
              subPath: node.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/admin.pem
              subPath: admin.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/admin-key.pem
              subPath: admin-key.pem
              readOnly: true
            - name: indexer-conf
              mountPath: /usr/share/wazuh-indexer/config/opensearch.yml
              subPath: opensearch.yml
              readOnly: true
            - name: indexer-conf
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              
              # Install S3 plugin if not installed
              if ! /usr/share/wazuh-indexer/bin/opensearch-plugin list | grep -q repository-s3; then
                  echo "Installing repository-s3 plugin..."
                  /usr/share/wazuh-indexer/bin/opensearch-plugin install --batch repository-s3
              fi
              
              # Create keystore if it doesn't exist
              if [ ! -f /usr/share/wazuh-indexer/config/opensearch.keystore ]; then
                  echo "Creating OpenSearch keystore..."
                  /usr/share/wazuh-indexer/bin/opensearch-keystore create
              fi
              
              # Add AWS credentials to keystore if not present
              if ! /usr/share/wazuh-indexer/bin/opensearch-keystore list 2>/dev/null | grep -q s3.client.default.access_key; then
                  echo "Adding AWS access key to keystore..."
                  echo -n "$AWS_ACCESS_KEY_ID" | /usr/share/wazuh-indexer/bin/opensearch-keystore add s3.client.default.access_key --stdin
              fi
              
              if ! /usr/share/wazuh-indexer/bin/opensearch-keystore list 2>/dev/null | grep -q s3.client.default.secret_key; then
                  echo "Adding AWS secret key to keystore..."
                  echo -n "$AWS_SECRET_ACCESS_KEY" | /usr/share/wazuh-indexer/bin/opensearch-keystore add s3.client.default.secret_key --stdin
              fi
              
              # Set proper permissions (ruta correcta)
              chown wazuh-indexer:wazuh-indexer /usr/share/wazuh-indexer/config/opensearch.keystore
              chmod 660 /usr/share/wazuh-indexer/config/opensearch.keystore

              # Add Gmail username
              if ! /usr/share/wazuh-indexer/bin/opensearch-keystore list 2>/dev/null \
                | grep -q opensearch.notifications.core.email.gmail.username; then
                  echo "Adding Gmail username..."
                  echo -n "$GMAIL_USERNAME" | \
                  /usr/share/wazuh-indexer/bin/opensearch-keystore add \
                  opensearch.notifications.core.email.gmail.username --stdin
              fi

              # Add Gmail password
              if ! /usr/share/wazuh-indexer/bin/opensearch-keystore list 2>/dev/null \
                | grep -q opensearch.notifications.core.email.gmail.password; then
                  echo "Adding Gmail password..."
                  echo -n "$GMAIL_PASSWORD" | \
                  /usr/share/wazuh-indexer/bin/opensearch-keystore add \
                  opensearch.notifications.core.email.gmail.password --stdin
              fi
              # Start OpenSearch with original entrypoint
              exec /usr/share/wazuh-indexer/bin/systemd-entrypoint           
          ports:
            - containerPort: 9200
              name: indexer-rest
            - containerPort: 9300
              name: indexer-nodes
  volumeClaimTemplates:
    - metadata:
        name: wazuh-indexer
        namespace: indexer-cluster
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 500Mi
