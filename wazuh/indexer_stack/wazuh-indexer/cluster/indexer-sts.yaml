# Indexer StatefulSet: 3 master nodes.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-upload-sa 
  namespace: wazuh-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::590183765660:role/Wazuh-S3-Alert-Upload
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wazuh-indexer
  serviceName: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
      name: wazuh-indexer
    spec:
      serviceAccountName: s3-upload-sa # <--- Service account with the IAM role to access S3 bucket
      # Set the wazuh-indexer volume permissions so the wazuh-indexer user can use it
      volumes:
        - name: indexer-certs
          secret:
            secretName: indexer-certs
        - name: indexer-conf
          configMap:
            name: indexer-conf
        - name: snapshots-volume  
          persistentVolumeClaim:
            claimName: snapshots-pvc  # ← We mount the PVC created manually               
      initContainers:
        - name: volume-mount-hack
          image: busybox
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          command:
            - sh
            - '-c'
            - 'chown -R 1000:1000 /var/lib/wazuh-indexer'
          volumeMounts:
            - name: wazuh-indexer
              mountPath: /var/lib/wazuh-indexer
        - name: increase-the-vm-max-map-count
          image: busybox
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true           
      containers:
        - name: wazuh-indexer
          image: 'wazuh/wazuh-indexer:4.12.0'
          resources:
            requests:
              cpu: 666m
              memory: 4Gi
            limits:
              cpu: 1 # originally on 500m
              memory: 4Gi # originally 1564Mi
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: '-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true'
            - name: CLUSTER_NAME
              value: wazuh
            - name: NETWORK_HOST
              value: "0.0.0.0"            
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY_SERVICE
              value: wazuh-indexer
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: 'true'
            - name: OPENSEARCH_PATH_CONF  # Config for S3 bucket snapshots
              value: "/usr/share/wazuh-indexer"              
          securityContext:
            capabilities:
              add: ["SYS_CHROOT"]
          volumeMounts:
            - name: wazuh-indexer
              mountPath: /var/lib/wazuh-indexer
            - name: snapshots-volume                # <--- New mount for snapshots
              mountPath: /mnt/snapshots
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/certs/node-key.pem
              subPath: node-key.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/certs/node.pem
              subPath: node.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/certs/admin.pem
              subPath: admin.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/certs/admin-key.pem
              subPath: admin-key.pem
              readOnly: true
            - name: indexer-conf
              mountPath: /usr/share/wazuh-indexer/opensearch.yml
              subPath: opensearch.yml
              readOnly: true
            - name: indexer-conf
              mountPath: /usr/share/wazuh-indexer/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    {
                      echo ">>> Verifying plugin repository-s3..."
                      if ! /usr/share/wazuh-indexer/bin/opensearch-plugin list | grep -q repository-s3; then
                        echo ">>> Installing plugin repository-s3..."
                        echo "y" | /usr/share/wazuh-indexer/bin/opensearch-plugin install repository-s3
                        echo ">>> Installation finished"
                      else
                        echo ">>> Plugin repository-s3 already installed, nothing to do."
                      fi

                      echo ">>> [postStart] Waiting for /mnt/snapshots..."
                      while [ ! -d /mnt/snapshots ]; do
                        sleep 1
                      done
                      echo ">>> Directory found, fixing permissions..."
                      chown -R 1000:1000 /mnt/snapshots
                      echo ">>> Permissions fixed on /mnt/snapshots"
                    } >> /usr/share/wazuh-indexer/poststart.log 2>&1
          ports:
            - containerPort: 9200
              name: indexer-rest
            - containerPort: 9300
              name: indexer-nodes
  volumeClaimTemplates:
    - metadata:
        name: wazuh-indexer
        namespace: indexer-cluster
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 500Mi
