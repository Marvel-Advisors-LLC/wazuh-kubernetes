apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Adds wazuh namespace to all resources.
namespace: wazuh

secretGenerator:
  - name: indexer-certs
    files:
      - certs/indexer_cluster/root-ca.pem
      - certs/indexer_cluster/node.pem
      - certs/indexer_cluster/node-key.pem
      - certs/indexer_cluster/dashboard.pem
      - certs/indexer_cluster/dashboard-key.pem
      - certs/indexer_cluster/admin.pem
      - certs/indexer_cluster/admin-key.pem
      - certs/indexer_cluster/filebeat.pem
      - certs/indexer_cluster/filebeat-key.pem
  - name: dashboard-certs
    files:
      - certs/dashboard_http/cert.pem
      - certs/dashboard_http/key.pem
      - certs/indexer_cluster/root-ca.pem

configMapGenerator:
  - name: indexer-conf
    files:
      - indexer_stack/wazuh-indexer/indexer_conf/opensearch.yml
      - indexer_stack/wazuh-indexer/indexer_conf/internal_users.yml
  - name: wazuh-conf
    files:
      - wazuh_managers/wazuh_conf/master.conf
      - wazuh_managers/wazuh_conf/worker.conf     
  - name: dashboard-conf
    files:
      - indexer_stack/wazuh-dashboard/dashboard_conf/opensearch_dashboards.yml
  - name: wazuh-filebeat-conf ##############My config
    files:
      - wazuh_managers/wazuh_conf/filebeat.yml # Custom Filebeat config 
      # Add any other custom Filebeat files here   
  - name: custom-rules-and-decoders
    files:
      - wazuh_managers/wazuh_conf/sentinelone_decoders.xml
      - wazuh_managers/wazuh_conf/sentinelone_rules.xml
      - wazuh_managers/wazuh_conf/local_rules.xml    
      # Add any other custom Filebeat files here 
  - name: integrations-cm
    files:
      - wazuh_managers/wazuh-integrations/custom-n8n-cm
      - wazuh_managers/wazuh-integrations/custom-n8n-cm.py  
  - name: syslog-ng-cm
    files:
      - wazuh_managers/wazuh_conf/syslog-ng-secrets/ca.crt
      - wazuh_managers/wazuh_conf/syslog-ng-secrets/tls.key
      - wazuh_managers/wazuh_conf/syslog-ng-secrets/tls.crt    ### End of my config #### 

resources:
  - base/wazuh-ns.yaml
  - base/storage-class.yaml

  - secrets/wazuh-api-cred-secret.yaml
  - secrets/wazuh-authd-pass-secret.yaml
  - secrets/wazuh-cluster-key-secret.yaml
  - secrets/dashboard-cred-secret.yaml
  - secrets/indexer-cred-secret.yaml
  - secrets/wazuh-s3-creds.yaml
  - secrets/m365-cred-secret.yaml
  - secrets/wazuh-gmail-notifications-channel.yaml

  

  - wazuh_managers/wazuh-cluster-svc.yaml
  - wazuh_managers/wazuh-master-svc.yaml
  - wazuh_managers/wazuh-workers-svc.yaml
  - wazuh_managers/wazuh-master-sts.yaml
  - wazuh_managers/wazuh-worker-sts.yaml
  - wazuh_managers/syslog-svc.yaml  #######STARTS MY  CONFIG###########################  
  - wazuh_managers/wazuh_conf/entrypoint-syslog-cm.yaml 
  - wazuh_managers/wazuh_conf/syslog-ng-cm.yaml   
  
  - cron_job/secrets/googlechat-webhook.yaml 
  - cron_job/manager-dashboard-healthcheck-cronjob.yaml
  - cron_job/indexer-healthcheck-cronjob.yaml ########## ENDS MY CONFIG ###########################

  - indexer_stack/wazuh-indexer/indexer-svc.yaml
  - indexer_stack/wazuh-indexer/cluster/indexer-api-svc.yaml
  - indexer_stack/wazuh-indexer/cluster/indexer-sts.yaml

  - indexer_stack/wazuh-dashboard/dashboard-svc.yaml
  - indexer_stack/wazuh-dashboard/dashboard-deploy.yaml
  - indexer_stack/wazuh-dashboard/dashboard-ingress.yaml
